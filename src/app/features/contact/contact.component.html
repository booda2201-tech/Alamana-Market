<div class="min-h-screen bg-gray-50/50 pt-28 pb-20 overflow-hidden" [attr.dir]="language.dir">

  <div class="bg-[#0275d8] text-white py-16 mb-12 relative overflow-hidden">
    <div class="container mx-auto px-4 text-center max-w-5xl header-content relative z-10">
      <h1 class="text-4xl md:text-5xl font-bold mb-6">{{ 'contact.title' | t }}</h1>
      <p class="text-white/80 text-lg leading-relaxed">
        {{ 'contact.subtitle' | t }}
      </p>
    </div>
    <div class="absolute top-0 left-0 w-64 h-64 bg-white/5 rounded-full -translate-x-1/2 -translate-y-1/2 blur-3xl"></div>
  </div>

  <div class="container max-w-7xl mx-auto px-4">
    <!-- Layout stays LTR so sidebar stays left & form stays right in both languages -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mx-auto" dir="ltr">

      <div class="lg:col-span-1 space-y-6" data-aos="fade-left" [attr.dir]="language.dir">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 space-y-8 h-auto">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 bg-blue-50 text-[#0275d8] rounded-xl flex items-center justify-center shrink-0">
              <i class="bi bi-geo-alt text-xl"></i>
            </div>
            <div class="flex-1 min-w-0 text-start">
              <h3 class="font-bold text-lg mb-2">{{ contactInfo.officeTitle }}</h3>
              <p class="text-gray-500 text-sm leading-relaxed whitespace-pre-line">
                {{ contactInfo.address }}
              </p>
            </div>
          </div>

          <div *ngIf="contactInfo.phones.length" class="flex items-start gap-4">
            <div class="w-12 h-12 bg-blue-50 text-[#0275d8] rounded-xl flex items-center justify-center shrink-0">
              <i class="bi bi-telephone text-xl"></i>
            </div>
            <div class="flex-1 min-w-0 text-start">
              <h3 class="font-bold text-lg mb-2">{{ 'contact.phone' | t }}</h3>
              <p class="text-gray-500 text-sm leading-relaxed font-medium" dir="ltr">
                <ng-container *ngFor="let phone of contactInfo.phones; let last = last">
                  {{ phone }}<br *ngIf="!last" />
                </ng-container>
              </p>
            </div>
          </div>

          <div *ngIf="contactInfo.email" class="flex items-start gap-4">
            <div class="w-12 h-12 bg-blue-50 text-[#0275d8] rounded-xl flex items-center justify-center shrink-0">
              <i class="bi bi-envelope text-xl"></i>
            </div>
            <div class="flex-1 min-w-0 text-start">
              <h3 class="font-bold text-lg mb-2">{{ 'contact.email' | t }}</h3>
              <p class="text-gray-500 text-sm leading-relaxed" dir="ltr">
                {{ contactInfo.email }}
              </p>
            </div>
          </div>

          <div *ngIf="contactInfo.workingHours" class="flex items-start gap-4">
            <div class="w-12 h-12 bg-blue-50 text-[#0275d8] rounded-xl flex items-center justify-center shrink-0">
              <i class="bi bi-clock text-xl"></i>
            </div>
            <div class="flex-1 min-w-0 text-start">
              <h3 class="font-bold text-lg mb-2">{{ 'contact.hours' | t }}</h3>
              <p class="text-gray-500 text-sm leading-relaxed whitespace-pre-line">
                {{ contactInfo.workingHours }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-2" data-aos="fade-right" [attr.dir]="language.dir">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12 h-full">
          <div class="flex items-center gap-3 mb-8">
            <i class="bi bi-chat-dots text-[#0275d8] text-2xl shrink-0"></i>
            <h2 class="text-2xl font-bold text-start">{{ 'contact.formTitle' | t }}</h2>
          </div>

          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.name' | t }}</label>
                <input formControlName="name"
                        class="w-full h-12 px-4 rounded-xl border border-gray-200 focus:border-[#0275d8] focus:ring-1 focus:ring-[#0275d8] outline-none transition-all text-start">
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.company' | t }}</label>
                <input formControlName="company"
                        class="w-full h-12 px-4 rounded-xl border border-gray-200 focus:border-[#0275d8] outline-none transition-all text-start">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.email' | t }}</label>
                <input formControlName="email" type="email" dir="ltr"
                        class="w-full h-12 px-4 rounded-xl border border-gray-200 focus:border-[#0275d8] outline-none transition-all text-start">
              </div>
              <div class="space-y-2">
                <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.phone' | t }}</label>
                <input formControlName="phone" type="tel" placeholder="+965" dir="ltr"
                        class="w-full h-12 px-4 rounded-xl border border-gray-200 focus:border-[#0275d8] outline-none transition-all text-start">
              </div>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.subject' | t }}</label>
              <select formControlName="subject"
                      class="w-full h-12 px-4 rounded-xl border border-gray-200 focus:border-[#0275d8] outline-none transition-all bg-white text-start">
                <option value="">{{ 'contact.subjectPlaceholder' | t }}</option>
                <option value="sales">{{ 'contact.subjectSales' | t }}</option>
                <option value="support">{{ 'contact.subjectSupport' | t }}</option>
                <option value="other">{{ 'contact.subjectOther' | t }}</option>
              </select>
            </div>

            <div class="space-y-2">
              <label class="text-sm font-medium text-gray-700 block text-start">{{ 'contact.message' | t }}</label>
              <textarea formControlName="message" rows="5" [placeholder]="'contact.messagePlaceholder' | t"
                        class="w-full p-4 rounded-xl border border-gray-200 focus:border-[#0275d8] outline-none transition-all resize-none text-start"></textarea>
            </div>

            <button type="submit"
                    [disabled]="isSubmitting || contactForm.invalid"
                    class="w-full h-12 bg-[#0275d8] text-white rounded-xl font-bold hover:bg-[#025bb0] disabled:opacity-50 transition-all shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
              <i *ngIf="!isSubmitting" class="bi bi-send" [class.-scale-x-100]="language.isRtl"></i>
              <span>{{ isSubmitting ? ('contact.sending' | t) : ('contact.send' | t) }}</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
